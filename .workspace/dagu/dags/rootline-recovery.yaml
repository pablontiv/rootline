description: Idempotent recovery of one explicitly named local owner
type: graph
working_dir: ../../..
dotenv: []
shell: bash
params:
  - name: SPACE_ID
    type: string
    required: true
    pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
  - name: RUN_ID
    type: string
    required: true
    pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
steps:
  - id: cleanup_owner
    run: bash .workspace/dagu/scripts/cleanup.sh "$SPACE_ID" "$RUN_ID"
