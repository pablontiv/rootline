description: SHA-bound local Rootline gate; hosted CI and releases remain unchanged
type: graph
working_dir: ../../..
dotenv: []
shell: bash
max_active_steps: 1
max_clean_up_time_sec: 120
params:
  - name: SPACE_ID
    type: string
    default: local
    pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
  - name: RUN_ID
    type: string
    required: true
    pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
  - name: MODE
    type: string
    default: shadow
    enum: [shadow, pr, merge]
  - name: ISSUE_NUMBER
    type: string
    default: '0'
    pattern: '^(0|[1-9][0-9]*)$'
steps:
  - id: sync
    run: bash .workspace/dagu/scripts/sync.sh "$SPACE_ID" "$RUN_ID"
  - id: tidy_clean
    depends: sync
    run: env -u GH_TOKEN -u GITHUB_TOKEN bash .workspace/dagu/scripts/check.sh "$SPACE_ID" "$RUN_ID" tidy-clean
  - id: check
    depends: tidy_clean
    run: env -u GH_TOKEN -u GITHUB_TOKEN bash .workspace/dagu/scripts/check.sh "$SPACE_ID" "$RUN_ID" check
  - id: test
    depends: check
    run: env -u GH_TOKEN -u GITHUB_TOKEN bash .workspace/dagu/scripts/check.sh "$SPACE_ID" "$RUN_ID" test
    retry_policy:
      limit: 2
      interval_sec: 5
  - id: coverage_check
    depends: test
    run: env -u GH_TOKEN -u GITHUB_TOKEN bash .workspace/dagu/scripts/check.sh "$SPACE_ID" "$RUN_ID" coverage-check
  - id: test_install
    depends: coverage_check
    run: env -u GH_TOKEN -u GITHUB_TOKEN bash .workspace/dagu/scripts/check.sh "$SPACE_ID" "$RUN_ID" test-install
    retry_policy:
      limit: 2
      interval_sec: 5
  - id: validate
    depends: test_install
    run: env -u GH_TOKEN -u GITHUB_TOKEN bash .workspace/dagu/scripts/check.sh "$SPACE_ID" "$RUN_ID" validate
  - id: govulncheck
    depends: validate
    run: env -u GH_TOKEN -u GITHUB_TOKEN bash .workspace/dagu/scripts/check.sh "$SPACE_ID" "$RUN_ID" govulncheck
  - id: gitleaks
    depends: govulncheck
    run: env -u GH_TOKEN -u GITHUB_TOKEN bash .workspace/dagu/scripts/check.sh "$SPACE_ID" "$RUN_ID" gitleaks
  - id: pr
    depends: gitleaks
    preconditions:
      - condition: '${MODE}'
        expected: shadow
        negate: true
    continue_on:
      skipped: true
    run: ISSUE_NUMBER="$ISSUE_NUMBER" bash .workspace/dagu/scripts/forge.sh "$SPACE_ID" "$RUN_ID" pr
    retry_policy:
      limit: 2
      interval_sec: 5
  - id: publish_status
    depends: pr
    preconditions:
      - condition: '${MODE}'
        expected: shadow
        negate: true
    continue_on:
      skipped: true
    run: ISSUE_NUMBER="$ISSUE_NUMBER" bash .workspace/dagu/scripts/forge.sh "$SPACE_ID" "$RUN_ID" status
    retry_policy:
      limit: 2
      interval_sec: 5
  - id: wait_ci
    depends: publish_status
    preconditions:
      - condition: '${MODE}'
        expected: shadow
        negate: true
    continue_on:
      skipped: true
    run: ISSUE_NUMBER="$ISSUE_NUMBER" bash .workspace/dagu/scripts/forge.sh "$SPACE_ID" "$RUN_ID" ci
    retry_policy:
      limit: 2
      interval_sec: 10
  - id: merge
    depends: wait_ci
    preconditions:
      - condition: '${MODE}'
        expected: merge
    continue_on:
      skipped: true
    run: ISSUE_NUMBER="$ISSUE_NUMBER" bash .workspace/dagu/scripts/forge.sh "$SPACE_ID" "$RUN_ID" merge
    retry_policy:
      limit: 2
      interval_sec: 5
# Exit covers success, exhausted failure, and explicit abort.
handler_on:
  exit:
    run: bash .workspace/dagu/scripts/cleanup.sh "$SPACE_ID" "$RUN_ID"
