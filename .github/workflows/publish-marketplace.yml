name: Publish Marketplace

on:
  push:
    branches: [master]
    paths:
      - ".claude/**"
  workflow_dispatch:

jobs:
  check-token:
    name: Check Token
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - name: Check for marketplace token
        id: check
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "MARKETPLACE_TOKEN not configured, skipping marketplace sync"
          fi
        env:
          TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}

  publish:
    name: Sync Skills to Marketplace
    needs: check-token
    if: needs.check-token.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get current version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Current version: ${VERSION#v}"

      - name: Checkout marketplace
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pablontiv/agent-marketplace
          token: ${{ secrets.MARKETPLACE_TOKEN }}
          path: marketplace

      - name: Compute source hash
        id: source_hash
        run: |
          HASH=$(find .claude/skills/ -type f -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Source skills hash: $HASH"

      - name: Compute destination hash
        id: dest_hash
        run: |
          HASH=$(find marketplace/skills/ -type f -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Destination skills hash: $HASH"

      - name: Check for changes
        id: diff
        run: |
          FORCE="${{ github.event_name == 'workflow_dispatch' }}"
          if [ "${{ steps.source_hash.outputs.hash }}" = "${{ steps.dest_hash.outputs.hash }}" ] && [ "$FORCE" != "true" ]; then
            echo "No changes detected between source and destination skills, skipping push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$FORCE" = "true" ]; then
              echo "Force sync via workflow_dispatch"
            else
              echo "Changes detected, proceeding with sync"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync skills
        if: steps.diff.outputs.changed == 'true'
        run: |
          for skill_dir in .claude/skills/*/; do
            skill_name=$(basename "$skill_dir")
            target="marketplace/skills/rootline-${skill_name}"
            mkdir -p "$target"
            rsync -av --delete "$skill_dir" "$target/"
            echo "Synced: $skill_name -> rootline-${skill_name}"
          done

      - name: Update marketplace version
        if: steps.diff.outputs.changed == 'true'
        run: |
          cd marketplace
          python3 -c "
          import json
          with open('.claude-plugin/marketplace.json', 'r') as f:
              data = json.load(f)
          data['metadata']['version'] = '${{ steps.version.outputs.version }}'
          with open('.claude-plugin/marketplace.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          print(f\"Updated version to: {data['metadata']['version']}\")
          "

      - name: Validate marketplace structure
        if: steps.diff.outputs.changed == 'true'
        run: |
          cd marketplace
          ERRORS=0

          # Validate marketplace.json is valid JSON
          if ! python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"; then
            echo "::error::marketplace.json is not valid JSON"
            ERRORS=$((ERRORS + 1))
          else
            echo "marketplace.json: valid JSON"
          fi

          # Extract skill paths from marketplace.json
          SKILL_PATHS=$(python3 -c "
          import json
          data = json.load(open('.claude-plugin/marketplace.json'))
          for plugin in data.get('plugins', []):
              for skill in plugin.get('skills', []):
                  print(skill.lstrip('./'))
          ")

          # Validate each referenced skill
          for skill_path in $SKILL_PATHS; do
            skill_md="${skill_path}/SKILL.md"
            if [ ! -f "$skill_md" ]; then
              echo "::error::Missing SKILL.md in ${skill_path}"
              ERRORS=$((ERRORS + 1))
              continue
            fi
            echo "${skill_path}: SKILL.md exists"

            # Check frontmatter has name and description
            HAS_NAME=$(python3 -c "
          import re
          content = open('${skill_md}').read()
          m = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
          if m and 'name:' in m.group(1):
              print('yes')
          else:
              print('no')
          ")
            HAS_DESC=$(python3 -c "
          import re
          content = open('${skill_md}').read()
          m = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
          if m and 'description:' in m.group(1):
              print('yes')
          else:
              print('no')
          ")
            if [ "$HAS_NAME" != "yes" ]; then
              echo "::error::${skill_md} missing 'name' in frontmatter"
              ERRORS=$((ERRORS + 1))
            fi
            if [ "$HAS_DESC" != "yes" ]; then
              echo "::error::${skill_md} missing 'description' in frontmatter"
              ERRORS=$((ERRORS + 1))
            fi
            if [ "$HAS_NAME" = "yes" ] && [ "$HAS_DESC" = "yes" ]; then
              echo "${skill_md}: frontmatter valid (name + description)"
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Marketplace validation failed with ${ERRORS} error(s)"
            exit 1
          fi
          echo "Marketplace validation passed"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          cd marketplace
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit (files identical after sync)"
            exit 0
          fi
          git commit -m "chore: sync skills from rootline@${GITHUB_SHA::7}"
          git push
          echo "Successfully pushed to agent-marketplace"
