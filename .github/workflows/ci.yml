name: CI

on:
  push:
    branches: [main, master]
  pull_request: {}
  workflow_dispatch:
    inputs:
      force-bump:
        description: Force a deliberate major release
        required: true
        type: choice
        options:
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ci:
    uses: pablontiv/crossbeam/.github/workflows/go-ci.yml@v1
    with:
      go-version-file: go.mod
      coverage-threshold: 85

  gitleaks:
    uses: pablontiv/crossbeam/.github/workflows/gitleaks.yml@v1

  docs-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go build -o rootline ./cmd/rootline/
      - run: ./rootline validate --all docs/roadmap/

  installer-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test install.sh resolver
        if: runner.os != 'Windows'
        shell: bash
        run: sh tests/installers/install-sh-test.sh
      - name: Test install.ps1 resolver
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/installers/install-ps1-test.ps1

  release:
    uses: pablontiv/crossbeam/.github/workflows/go-release.yml@v1
    needs: [ci, gitleaks, docs-validate, installer-tests]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    with:
      quality-gate-jobs: '["ci","gitleaks","docs-validate","installer-tests"]'
      binary-name: rootline
      force-bump: ${{ inputs['force-bump'] }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  # Post-release installer smoke test: prove the just-published release actually
  # installs and runs through the public install scripts on every supported OS.
  # Native runners (no Docker/qemu) exercise the real platform tooling — e.g.
  # macOS's BSD sha256sum, whose lack of `--check` once silently broke
  # install.sh on every Mac, and real Windows, where install.ps1's $env:TEMP /
  # $env:LOCALAPPDATA assumptions hold. Also catches release-asset defects the
  # binary --version smoke misses: missing checksums.txt, wrong archive naming,
  # bad permissions.
  #
  # POSSIBLE MIGRATION: install-script smoke testing is generic and could move
  # to a reusable crossbeam workflow (pablontiv/crossbeam), mirroring go-ci /
  # go-release, so every Go CLI repo reuses it. Kept inline for now — like
  # docs-validate — while it proves its value. Tracked in docs/roadmap/T012.
  installer-smoke:
    needs: [release]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: install.sh smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          # Retry transient release-page and CDN failures.
          for attempt in 1 2 3; do
            if sh install.sh; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "install.sh attempt ${attempt} failed; retrying in 5s..."
            sleep 5
          done
          # install.sh installs to ~/.local/bin (the canonical destination),
          # which is not necessarily on the runner PATH — invoke by full path.
          "${HOME}/.local/bin/rootline" --version
      - name: install.ps1 smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            try { & ./install.ps1; break }
            catch {
              if ($i -eq 3) { throw }
              Write-Host "install.ps1 attempt $i failed: $_; retrying in 5s..."
              Start-Sleep 5
            }
          }
          # install.ps1 installs to %LOCALAPPDATA%\rootline\bin and only updates
          # the persistent User PATH, not this job's PATH — invoke by full path.
          & (Join-Path $env:LOCALAPPDATA "rootline\bin\rootline.exe") --version
