name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: ${{ matrix.go-version }}

      - run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: stable

      - run: go test ./... -race -coverprofile=coverage.out

      - name: Check coverage threshold
        env:
          COVERAGE_THRESHOLD: 85
        run: |
          COVERAGE=$(go tool cover -func coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out

  tidy:
    name: Go Mod Tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: stable

      - run: go mod tidy

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the changes."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: stable

      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.10.1

  vuln:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: stable

      - run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - run: govulncheck ./...

  docs-validate:
    name: Docs Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: stable

      - run: go build -o rootline ./cmd/rootline/

      - run: ./rootline validate --all docs/epics/

  auto-tag:
    name: Auto Tag & Release
    needs: [build, test, tidy, lint, vuln, docs-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Tag untagged commits
        id: tag
        run: |
          set -e

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git rev-list --reverse HEAD)
            LAST_TAG="v0.0.0"
          else
            COMMITS=$(git rev-list --reverse "${LAST_TAG}..HEAD")
          fi

          LATEST_TAG=""
          for COMMIT in $COMMITS; do
            # Skip already-tagged commits
            EXISTING=$(git tag --points-at "$COMMIT" 2>/dev/null | head -1)
            if [ -n "$EXISTING" ]; then
              LAST_TAG="$EXISTING"
              continue
            fi

            MSG=$(git log -1 --format=%s "$COMMIT")

            # Determine bump type from conventional commit prefix
            BUMP=""
            case "$MSG" in
              feat\!*|fix\!*|refactor\!*|perf\!*)  BUMP="breaking" ;;
              feat*)                                 BUMP="feat" ;;
              fix*|perf*)                            BUMP="fix" ;;
            esac
            [ -z "$BUMP" ] && continue

            # Parse current version
            MAJOR=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d. -f3)

            # Apply pre-1.0 vs post-1.0 strategy
            if [ "$MAJOR" -eq 0 ]; then
              # Pre-1.0: feat=patch, fix=patch, breaking=minor
              case "$BUMP" in
                breaking)  MINOR=$((MINOR + 1)); PATCH=0 ;;
                *)         PATCH=$((PATCH + 1)) ;;
              esac
            else
              # Post-1.0: feat=minor, fix=patch, breaking=major
              case "$BUMP" in
                breaking)  MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                feat)      MINOR=$((MINOR + 1)); PATCH=0 ;;
                *)         PATCH=$((PATCH + 1)) ;;
              esac
            fi

            NEXT="v${MAJOR}.${MINOR}.${PATCH}"
            echo "Tagging $COMMIT (${MSG%%:*}) as $NEXT"
            git tag "$NEXT" "$COMMIT"
            git push origin "$NEXT"
            LAST_TAG="$NEXT"
            LATEST_TAG="$NEXT"
          done

          echo "latest=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Release
        if: steps.tag.outputs.latest != ''
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.latest }}
