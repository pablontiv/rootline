name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    uses: pablontiv/crossbeam/.github/workflows/go-ci.yml@v1
    with:
      go-version-file: go.mod
      coverage-threshold: 85

  gitleaks:
    uses: pablontiv/crossbeam/.github/workflows/gitleaks.yml@v1

  docs-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod
      - run: go build -o rootline ./cmd/rootline/
      - run: ./rootline validate --all docs/roadmap/

  pi-extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@v2
      - run: cd integrations/pi && bun install
      - run: cd integrations/pi && bun test

  release:
    uses: pablontiv/crossbeam/.github/workflows/go-release.yml@v1
    needs: [ci, gitleaks, docs-validate, pi-extensions]
    if: github.event_name == 'push'
    with:
      quality-gate-jobs: '["ci","gitleaks","docs-validate","pi-extensions"]'
      binary-name: rootline
    permissions:
      contents: write
      id-token: write
      attestations: write
